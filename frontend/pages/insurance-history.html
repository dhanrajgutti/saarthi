<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Policy Issue History - Vehicle Verification Portal</title>
    <link rel="stylesheet" href="../css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .history-page {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        main.func-page-layout {
            max-width: 100% !important;
            width: 100% !important;
            padding: 10px 12px 16px !important;
            margin-left: 0 !important;
            margin-right: 0 !important;
        }

        .history-topbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
        }

        .history-topbar .btn {
            height: 34px;
            padding: 0 14px;
            font-size: 11.5px;
            border-radius: 8px;
        }

        .history-filter-panel,
        .history-table-panel {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.04);
        }

        .history-filter-panel {
            padding: 10px 10px 8px;
            border-radius: 10px;
        }

        .history-filter-panel .func-form-group {
            gap: 4px;
        }

        .history-filter-panel .func-form-label {
            font-size: 10.5px;
            letter-spacing: 0.15px;
            margin-bottom: 0;
        }

        .history-filter-panel .func-form-input,
        .history-filter-panel .func-form-select {
            height: 34px;
            min-height: 34px;
            padding: 6px 9px;
            font-size: 12.5px;
            border-radius: 7px;
        }

        .history-filter-panel .btn {
            height: 34px;
            padding: 0 14px;
            font-size: 12px;
            border-radius: 7px;
        }

        .history-filter-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 8px 10px;
            align-items: end;
        }

        .history-action-row {
            display: flex;
            justify-content: flex-end;
            gap: 7px;
            grid-column: 4 / 6;
            flex-wrap: wrap;
            align-items: center;
        }

        .history-table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-bottom: 1px solid #E2E8F0;
        }

        .history-table-title {
            font-size: 12px;
            font-weight: 700;
            color: #0F172A;
        }

        .history-table-subtitle {
            font-size: 10.5px;
            color: #64748B;
            margin-top: 1px;
        }

        .history-table-wrap {
            overflow-x: hidden;
            overflow-y: auto;
            width: 100%;
            max-width: 100%;
        }

        .history-table {
            width: 100%;
            min-width: 0;
            max-width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .history-table thead th {
            background: #F8FAFC;
            color: #475569;
            font-size: 9.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.25px;
            padding: 6px 5px;
            border-bottom: 1px solid #E2E8F0;
            white-space: nowrap;
            text-align: left;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .history-table thead th.col-sr {
            width: 44px;
            text-align: center;
        }

        .history-table thead th.col-policy { width: 13%; }
        .history-table thead th.col-insured { width: 13%; }
        .history-table thead th.col-vehicle { width: 11%; }
        .history-table thead th.col-type { width: 10%; }
        .history-table thead th.col-period { width: 16%; }
        .history-table thead th.col-premium { width: 10%; }
        .history-table thead th.col-issued { width: 13%; }
        .history-table thead th.col-status { width: 8%; }
        .history-table thead th.col-action { width: 6%; text-align: center; }

        .history-table tbody td {
            padding: 5.5px 5px;
            font-size: 11px;
            color: #0F172A;
            border-bottom: 1px solid #E2E8F0;
            vertical-align: middle;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-table tbody tr:hover td {
            background: #F8FBFF;
        }

        .history-table tbody tr:last-child td {
            border-bottom: none;
        }

        .col-sr {
            width: 44px;
            text-align: center;
            color: #64748B;
            font-weight: 600;
            font-size: 10.5px;
        }

        .policy-no {
            font-weight: 700;
            color: #0F4C81;
        }

        .money {
            font-weight: 700;
            color: #0F172A;
            text-align: right;
            padding-right: 12px !important;
            font-variant-numeric: tabular-nums;
        }

        .status-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 60px;
            padding: 1.5px 6px;
            border-radius: 999px;
            font-size: 9px;
            font-weight: 700;
        }

        .status-issued {
            background: rgba(22, 163, 74, 0.12);
            color: #15803D;
        }

        .status-cancelled {
            background: rgba(220, 38, 38, 0.12);
            color: #DC2626;
        }

        .status-pending {
            background: rgba(217, 119, 6, 0.12);
            color: #D97706;
        }

        .status-expired {
            background: rgba(100, 116, 139, 0.14);
            color: #475569;
        }

        .action-cell {
            text-align: center;
        }

        .view-btn {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            border: 1px solid #DBEAFE;
            background: #EFF6FF;
            color: #0F4C81;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .view-btn:hover {
            background: #0F4C81;
            border-color: #0F4C81;
            color: #FFFFFF;
        }

        .view-btn svg {
            width: 12px;
            height: 12px;
        }

        .history-table-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            border-top: 1px solid #E2E8F0;
            font-size: 10.5px;
            color: #64748B;
            flex-wrap: wrap;
        }

        .history-pagination {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .page-btn {
            min-width: 26px;
            height: 26px;
            padding: 0 8px;
            border: 1px solid #CBD5E1;
            border-radius: 6px;
            background: #FFFFFF;
            color: #334155;
            font-size: 10.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .page-btn:hover:not(:disabled) {
            border-color: #0F4C81;
            color: #0F4C81;
        }

        .page-btn.active {
            background: #0F4C81;
            border-color: #0F4C81;
            color: #FFFFFF;
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .history-empty {
            padding: 44px 24px;
            text-align: center;
            color: #64748B;
        }

        .history-empty svg {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        .history-empty h3 {
            font-size: 16px;
            color: #0F172A;
            margin-bottom: 6px;
        }

        .history-empty p {
            font-size: 13px;
        }

        .policy-modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 200;
        }

        .policy-modal.open {
            display: flex;
        }

        .policy-modal-card {
            width: min(760px, 100%);
            background: #FFFFFF;
            border-radius: 18px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.24);
            overflow: hidden;
        }

        .policy-modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 18px 22px;
            border-bottom: 1px solid #E2E8F0;
        }

        .policy-modal-title {
            font-size: 18px;
            font-weight: 700;
            color: #0F172A;
        }

        .policy-modal-close {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 10px;
            background: #F1F5F9;
            color: #334155;
            cursor: pointer;
            font-size: 18px;
        }

        .policy-modal-body {
            padding: 22px;
        }

        .policy-modal-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .modal-field {
            padding: 14px 16px;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            background: #F8FAFC;
        }

        .modal-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.45px;
            color: #64748B;
            margin-bottom: 6px;
        }

        .modal-value {
            font-size: 14px;
            font-weight: 600;
            color: #0F172A;
        }

        .modal-field.full {
            grid-column: 1 / -1;
        }

        @media (max-width: 1180px) {
            .history-filter-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .history-action-row {
                grid-column: 1 / -1;
                justify-content: flex-start;
            }
        }

        @media (max-width: 768px) {
            .history-filter-grid,
            .policy-modal-grid {
                grid-template-columns: 1fr;
            }

            .history-topbar {
                justify-content: flex-start;
            }

            .history-topbar .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <main class="func-page-layout">
        <div class="history-page">
            <div class="history-topbar">
                <button type="button" class="btn btn-outline" id="exportBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Export
                </button>
            </div>

            <section class="history-filter-panel">
                <div class="history-filter-grid">
                    <div class="func-form-group">
                        <label class="func-form-label" for="filterFromDate">From Date</label>
                        <input id="filterFromDate" type="date" class="func-form-input" value="2025-05-01">
                    </div>
                    <div class="func-form-group">
                        <label class="func-form-label" for="filterToDate">To Date</label>
                        <input id="filterToDate" type="date" class="func-form-input" value="2025-05-18">
                    </div>
                    <div class="func-form-group">
                        <label class="func-form-label" for="filterPolicyNumber">Policy Number</label>
                        <input id="filterPolicyNumber" type="text" class="func-form-input" placeholder="Enter Policy No.">
                    </div>
                    <div class="func-form-group">
                        <label class="func-form-label" for="filterVehicleNumber">Vehicle Number</label>
                        <input id="filterVehicleNumber" type="text" class="func-form-input" placeholder="Enter Vehicle No.">
                    </div>
                    <div class="func-form-group">
                        <label class="func-form-label" for="filterPolicyType">Policy Type</label>
                        <select id="filterPolicyType" class="func-form-select">
                            <option value="All">All Types</option>
                            <option value="Comprehensive">Comprehensive</option>
                            <option value="Third Party">Third Party</option>
                        </select>
                    </div>
                    <div class="func-form-group">
                        <label class="func-form-label" for="filterInsuredName">Insured Name</label>
                        <input id="filterInsuredName" type="text" class="func-form-input" placeholder="Enter Insured Name">
                    </div>
                    <div class="func-form-group">
                        <label class="func-form-label" for="filterStatus">Status</label>
                        <select id="filterStatus" class="func-form-select">
                            <option value="All">All Status</option>
                            <option value="Issued">Issued</option>
                            <option value="Cancelled">Cancelled</option>
                            <option value="Pending">Pending</option>
                            <option value="Expired">Expired</option>
                        </select>
                    </div>
                    <div class="history-action-row">
                        <button type="button" class="btn btn-outline" id="resetBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="23 4 23 10 17 10"/>
                                <polyline points="1 20 1 14 7 14"/>
                                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                            </svg>
                            Reset
                        </button>
                        <button type="button" class="btn btn-primary" id="searchBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"/>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                            </svg>
                            Search
                        </button>
                    </div>
                </div>
            </section>

            <section class="history-table-panel">
                <div class="history-table-header">
                    <div>
                        <div class="history-table-title">Issued Policy Register</div>
                        <div class="history-table-subtitle">Search all issued, pending, cancelled, and expired insurance policies.</div>
                    </div>
                </div>

                <div class="history-table-wrap">
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th class="col-sr">Sr. No.</th>
                                <th class="col-policy">Policy Number</th>
                                <th class="col-insured">Insured Name</th>
                                <th class="col-vehicle">Vehicle Number</th>
                                <th class="col-type">Policy Type</th>
                                <th class="col-period">Policy Period</th>
                                <th class="col-premium" style="text-align: right;">Premium (Rs)</th>
                                <th class="col-issued">Issue Date &amp; Time</th>
                                <th class="col-status">Status</th>
                                <th class="col-action" style="text-align: center;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody"></tbody>
                    </table>
                </div>

                <div class="history-table-footer">
                    <div id="showingText">Showing 0 to 0 of 0 entries</div>
                    <div class="history-pagination" id="pagination"></div>
                </div>
            </section>
        </div>
    </main>

    <div class="policy-modal" id="policyModal" aria-hidden="true">
        <div class="policy-modal-card">
            <div class="policy-modal-head">
                <div class="policy-modal-title">Policy Details</div>
                <button type="button" class="policy-modal-close" id="closeModalBtn" aria-label="Close policy details">&times;</button>
            </div>
            <div class="policy-modal-body">
                <div class="policy-modal-grid" id="policyModalGrid"></div>
            </div>
        </div>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/dashboard.js"></script>
    <script>
        (function() {
            const PAGE_SIZE = 10;
            const formatter = new Intl.NumberFormat('en-IN');

            function policyTypeFromPlan(plan) {
                if (!plan) return 'Comprehensive';
                if (plan.indexOf('Third') > -1) return 'Third Party';
                return 'Comprehensive';
            }
            function pad2(n){ return String(n).padStart(2,'0'); }

            const RAW_POLICY_DATA = (window.VehicleData && VehicleData.POLICY_DATA) || [];
            const POLICY_DATA = RAW_POLICY_DATA.map(function(p) {
                const hour = 9 + (p.i % 8);
                const min  = 15 * (p.i % 4);
                return {
                    policyNumber: p.policyNo,
                    insuredName: p.ownerName,
                    vehicleNumber: p.vehicleReg,
                    policyType: policyTypeFromPlan(p.plan),
                    startDate: p.startDateIso,
                    endDate: p.endDateIso,
                    premium: p.totalPremium,
                    issuedAt: p.issueDateIso + 'T' + pad2(hour) + ':' + pad2(min) + ':00',
                    status: p.status === 'Renewal Due' ? 'Issued' : p.status
                };
            });

            const state = {
                page: 1,
                filtered: POLICY_DATA.slice(),
                activePolicy: null
            };

            function getEl(id) {
                return document.getElementById(id);
            }

            function formatDate(value) {
                const date = new Date(value);
                const day = String(date.getDate()).padStart(2, '0');
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const year = date.getFullYear();
                return day + '/' + month + '/' + year;
            }

            function formatDateTime(value) {
                const date = new Date(value);
                const datePart = formatDate(value);
                const timePart = date.toLocaleTimeString('en-IN', {
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: true
                });
                return datePart + ' ' + timePart;
            }

            function getPolicyPeriod(policy) {
                return formatDate(policy.startDate) + ' - ' + formatDate(policy.endDate);
            }

            function getStatusClass(status) {
                if (status === 'Issued') return 'status-issued';
                if (status === 'Cancelled') return 'status-cancelled';
                if (status === 'Pending') return 'status-pending';
                return 'status-expired';
            }

            function matchesText(value, query) {
                return value.toLowerCase().includes(query.toLowerCase());
            }

            function getFilters() {
                return {
                    fromDate: getEl('filterFromDate').value,
                    toDate: getEl('filterToDate').value,
                    policyNumber: getEl('filterPolicyNumber').value.trim(),
                    vehicleNumber: getEl('filterVehicleNumber').value.trim(),
                    policyType: getEl('filterPolicyType').value,
                    insuredName: getEl('filterInsuredName').value.trim(),
                    status: getEl('filterStatus').value
                };
            }

            function applyFilters() {
                const filters = getFilters();
                const fromDate = filters.fromDate ? new Date(filters.fromDate + 'T00:00:00') : null;
                const toDate = filters.toDate ? new Date(filters.toDate + 'T23:59:59') : null;

                state.filtered = POLICY_DATA.filter(function(policy) {
                    const issuedAt = new Date(policy.issuedAt);

                    if (fromDate && issuedAt < fromDate) return false;
                    if (toDate && issuedAt > toDate) return false;
                    if (filters.policyNumber && !matchesText(policy.policyNumber, filters.policyNumber)) return false;
                    if (filters.vehicleNumber && !matchesText(policy.vehicleNumber, filters.vehicleNumber)) return false;
                    if (filters.insuredName && !matchesText(policy.insuredName, filters.insuredName)) return false;
                    if (filters.policyType !== 'All' && policy.policyType !== filters.policyType) return false;
                    if (filters.status !== 'All' && policy.status !== filters.status) return false;

                    return true;
                });

                state.page = 1;
                renderTable();
            }

            function renderEmptyState() {
                getEl('historyTableBody').innerHTML = [
                    '<tr>',
                    '<td colspan="10">',
                    '<div class="history-empty">',
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">',
                    '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>',
                    '<polyline points="14 2 14 8 20 8"></polyline>',
                    '<circle cx="11" cy="13" r="2.5"></circle>',
                    '<line x1="16.5" y1="18.5" x2="20" y2="22"></line>',
                    '</svg>',
                    '<h3>No policy records found</h3>',
                    '<p>Try changing the filters and search again.</p>',
                    '</div>',
                    '</td>',
                    '</tr>'
                ].join('');

                getEl('showingText').textContent = 'Showing 0 to 0 of 0 entries';
                getEl('pagination').innerHTML = '';
            }

            function renderPagination(totalPages) {
                const pagination = getEl('pagination');
                if (totalPages <= 1) {
                    pagination.innerHTML = '';
                    return;
                }

                const buttons = [];
                buttons.push('<button type="button" class="page-btn" data-page="' + (state.page - 1) + '" ' + (state.page === 1 ? 'disabled' : '') + '>&lsaquo;</button>');

                for (let page = 1; page <= totalPages; page += 1) {
                    buttons.push('<button type="button" class="page-btn ' + (page === state.page ? 'active' : '') + '" data-page="' + page + '">' + page + '</button>');
                }

                buttons.push('<button type="button" class="page-btn" data-page="' + (state.page + 1) + '" ' + (state.page === totalPages ? 'disabled' : '') + '>&rsaquo;</button>');
                pagination.innerHTML = buttons.join('');
            }

            function renderTable() {
                if (!state.filtered.length) {
                    renderEmptyState();
                    return;
                }

                const totalEntries = state.filtered.length;
                const totalPages = Math.ceil(totalEntries / PAGE_SIZE);
                if (state.page > totalPages) {
                    state.page = totalPages;
                }

                const startIndex = (state.page - 1) * PAGE_SIZE;
                const pageRows = state.filtered.slice(startIndex, startIndex + PAGE_SIZE);

                getEl('historyTableBody').innerHTML = pageRows.map(function(policy, index) {
                    return [
                        '<tr>',
                        '<td class="col-sr">', String(startIndex + index + 1), '</td>',
                        '<td class="policy-no">', policy.policyNumber, '</td>',
                        '<td>', policy.insuredName, '</td>',
                        '<td>', policy.vehicleNumber, '</td>',
                        '<td>', policy.policyType, '</td>',
                        '<td>', getPolicyPeriod(policy), '</td>',
                        '<td class="money">', formatter.format(policy.premium), '</td>',
                        '<td>', formatDateTime(policy.issuedAt), '</td>',
                        '<td><span class="status-chip ', getStatusClass(policy.status), '">', policy.status, '</span></td>',
                        '<td class="action-cell">',
                        '<button type="button" class="view-btn" data-policy="', policy.policyNumber, '" title="View policy">',
                        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">',
                        '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>',
                        '<circle cx="12" cy="12" r="3"></circle>',
                        '</svg>',
                        '</button>',
                        '</td>',
                        '</tr>'
                    ].join('');
                }).join('');

                const showingFrom = startIndex + 1;
                const showingTo = Math.min(startIndex + PAGE_SIZE, totalEntries);
                getEl('showingText').textContent = 'Showing ' + showingFrom + ' to ' + showingTo + ' of ' + totalEntries + ' entries';

                renderPagination(totalPages);
            }

            function openModal(policyNumber) {
                const policy = POLICY_DATA.find(function(item) {
                    return item.policyNumber === policyNumber;
                });

                if (!policy) return;

                state.activePolicy = policy;
                getEl('policyModalGrid').innerHTML = [
                    createModalField('Policy Number', policy.policyNumber),
                    createModalField('Status', '<span class="status-chip ' + getStatusClass(policy.status) + '">' + policy.status + '</span>'),
                    createModalField('Insured Name', policy.insuredName),
                    createModalField('Vehicle Number', policy.vehicleNumber),
                    createModalField('Policy Type', policy.policyType),
                    createModalField('Premium', 'Rs ' + formatter.format(policy.premium)),
                    createModalField('Policy Period', getPolicyPeriod(policy), true),
                    createModalField('Issue Date & Time', formatDateTime(policy.issuedAt), true)
                ].join('');

                getEl('policyModal').classList.add('open');
                getEl('policyModal').setAttribute('aria-hidden', 'false');
            }

            function createModalField(label, value, full) {
                return [
                    '<div class="modal-field', full ? ' full' : '', '">',
                    '<div class="modal-label">', label, '</div>',
                    '<div class="modal-value">', value, '</div>',
                    '</div>'
                ].join('');
            }

            function closeModal() {
                getEl('policyModal').classList.remove('open');
                getEl('policyModal').setAttribute('aria-hidden', 'true');
                state.activePolicy = null;
            }

            function exportCsv() {
                const headers = ['Policy Number', 'Insured Name', 'Vehicle Number', 'Policy Type', 'Policy Period', 'Premium (Rs)', 'Issue Date & Time', 'Status'];
                const rows = state.filtered.map(function(policy) {
                    return [
                        policy.policyNumber,
                        policy.insuredName,
                        policy.vehicleNumber,
                        policy.policyType,
                        getPolicyPeriod(policy),
                        policy.premium,
                        formatDateTime(policy.issuedAt),
                        policy.status
                    ];
                });

                const csv = [headers].concat(rows).map(function(row) {
                    return row.map(function(cell) {
                        return '"' + String(cell).replace(/"/g, '""') + '"';
                    }).join(',');
                }).join('\r\n');

                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'policy-issue-history.csv';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            }

            function resetFilters() {
                getEl('filterFromDate').value = '2025-05-01';
                getEl('filterToDate').value = '2025-05-18';
                getEl('filterPolicyNumber').value = '';
                getEl('filterVehicleNumber').value = '';
                getEl('filterPolicyType').value = 'All';
                getEl('filterInsuredName').value = '';
                getEl('filterStatus').value = 'All';
                applyFilters();
            }

            function bindEvents() {
                getEl('searchBtn').addEventListener('click', applyFilters);
                getEl('resetBtn').addEventListener('click', resetFilters);
                getEl('exportBtn').addEventListener('click', exportCsv);
                getEl('closeModalBtn').addEventListener('click', closeModal);

                ['filterPolicyNumber', 'filterVehicleNumber', 'filterInsuredName'].forEach(function(id) {
                    getEl(id).addEventListener('keydown', function(event) {
                        if (event.key === 'Enter') {
                            applyFilters();
                        }
                    });
                });

                getEl('pagination').addEventListener('click', function(event) {
                    const button = event.target.closest('[data-page]');
                    if (!button || button.disabled) return;
                    state.page = Number(button.getAttribute('data-page'));
                    renderTable();
                });

                getEl('historyTableBody').addEventListener('click', function(event) {
                    const button = event.target.closest('.view-btn');
                    if (!button) return;
                    openModal(button.getAttribute('data-policy'));
                });

                getEl('policyModal').addEventListener('click', function(event) {
                    if (event.target === getEl('policyModal')) {
                        closeModal();
                    }
                });

                document.addEventListener('keydown', function(event) {
                    if (event.key === 'Escape' && getEl('policyModal').classList.contains('open')) {
                        closeModal();
                    }
                });
            }

            function initPage() {
                bindEvents();
                applyFilters();
            }

            document.addEventListener('DOMContentLoaded', function() {
                const auth = DashboardApp.init(['INSURANCE_AGENCY'], 'Authorized Insurance Agency', 'history');

                if (!auth) return;
                initPage();
            });
        })();
    </script>
</body>
</html>
