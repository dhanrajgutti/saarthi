server.port=8080
server.servlet.context-path=/api

spring.datasource.url=jdbc:mysql://localhost:3306/vehical_auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=bmit
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=vehicalAuthSecretKeyForJwtTokenGenerationMustBeAtLeast256BitsLong1234567890
jwt.expiration.ms=86400000

spring.servlet.multipart.enabled=true

logging.level.org.springframework.security=DEBUG
logging.level.com.vehical.auth=DEBUG
