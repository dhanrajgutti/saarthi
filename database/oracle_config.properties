# Oracle Database Configuration
# Update these values according to your Oracle database setup

# Database Connection
oracle.host=localhost
oracle.port=1521
oracle.sid=ORCL
# OR use service name instead of SID
# oracle.service_name=ORCL

# Authentication
oracle.username=YOUR_ORACLE_USERNAME
oracle.password=YOUR_ORACLE_PASSWORD

# Connection Pool Settings (if using connection pool)
oracle.pool.initialSize=5
oracle.pool.maxTotal=20
oracle.pool.maxIdle=10
oracle.pool.minIdle=5

# JDBC URL Format
# For SID: jdbc:oracle:thin:@//host:port/sid
# For Service Name: jdbc:oracle:thin:@//host:port/service_name
# Example: jdbc:oracle:thin:@//localhost:1521/ORCL

# Driver Class
oracle.driver=oracle.jdbc.OracleDriver

# Additional Properties
oracle.autoCommit=false
oracle.connectionTimeout=30000
oracle.queryTimeout=30
